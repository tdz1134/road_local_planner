# ═══════════════════════════════════════════════════════════════════════════
# grid_node 参数（点云 → 2D 占据栅格，/velodyne_points → /local_grid）
#
# ── 症状 → 该动哪个参数（速查）────────────────────────────────
# 障碍拖影/噪点多      → z_max↓、resolution↑（格子大噪点自然被平均掉）
# 矮障碍看不见         → z_min↓（但会开始打到地面）
# 大片 unknown 不消失   → 检查 max_range 是否小于实际障碍距离（无回波补 free 只到量程）
# 栅格刷新卡/吃 CPU    → resolution↑ 或 window_size↓（格数 = (窗口/分辨率)²）
# 车体周围莫名禁区     → 车体自身点漏进切片，z_max 低于雷达安装高度或调 footprint_clear
# ═══════════════════════════════════════════════════════════════════════════

# ── 输入 ──
input_topic: /velodyne_points     # 点云话题
sensor_frame: velodyne            # 点云坐标系（TF 源）
base_frame: base_link             # 目标坐标系（栅格输出在此系下，车在窗口中心）

# ── 栅格几何 ──
# 格数 = (window_size/resolution)²，内存和每帧耗时都按这个平方增长
resolution: 0.1                   # 栅格分辨率 m/格。要 ≤ 膨胀半径的一半，否则膨胀圈锯齿明显
window_size: 34.0                 # 局部窗口边长 m（= 1.7 × sensor_range）。
                                  # 车在中心，前后各覆盖 window/2 = 17m

# ── 点云过滤 ──
z_min: 0.1                        # Z 下限 m（base_link 系，过滤地面点）。调低会打到斜坡/地面
z_max: 2.5                        # Z 上限 m（base_link 系，过滤过高噪声）。
                                  # 想看见更高障碍就调大，但拖影噪声也变多
max_range: 25.0                   # 水平距离裁剪 m：回波点超过此距离丢弃；
                                  # 无回波方向的 free 射线也只打到这个距离。
                                  # 建议 ≥ window/2（否则窗口边缘永远填不满 free）
