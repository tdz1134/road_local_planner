# ═══════════════════════════════════════════════════════════════════════════
# unk_nav 终点模式配置（有定位，全局终点投影子目标）
#
# 加载方式：nav_node 启动时经 unk::loadNavParams() 读取（路径由 launch 的
#           config_file 私有参数传入，不走 ROS 参数服务器）
#
# 格式约束（params_io.cpp 严格校验）：
#   · 顶层扁平 key: value，key 与 types.h::NavParams 字段一一对应
#   · 未知 key / 类型不对 → 启动直接报错退出
#   · 未写的 key → 保持 types.h::NavParams 代码默认值
#   · 加参数三处同步：types.h 字段 + params_io.cpp 绑定表 + 本文件一行
#
# ── 症状 → 该动哪个参数（速查）────────────────────────────────────────────
# 撞障碍/贴边太近      → inflation_radius↑、pursuit_lookahead↓
# 窄通道过不去/老 ABORT → inflation_radius↓
# 不绕障碍、直冲墙      → lookahead_ratio↑
# 刹车顿挫/急停频繁     → safety_margin↑、a_decel_max↓、t_reaction↑
# 到点不停/停太偏       → goal_tolerance↓
# 跟踪不紧/车身拖在弯外  → control_freq↑、w_max↑
# 指令跳变/执行器饱和   → cmd_a_max↓、cmd_w_dot_max↓
# 卡住不放弃/放弃太快   → stuck_time、recovery_max_retry
# 贴墙不减速/冲过终点   → stop_horizon 自动生效
# 凹槽内振荡不绕        → subgoal_fan_half_deg↑、subgoal_align_w↓
# 终点贴墙到不了 ABORT  → goal_clear_radius ≥ inflation_radius
# 过弯切内墙/不减速     → chain_hops↑、curve_fit_enable
# κ/曲线逐帧抖动        → chain_ema_alpha↓、road_fan_step_deg↓
# ═══════════════════════════════════════════════════════════════════════════

# ── 1. 车辆能力（Scout v2 差速底盘）──
v_max: 1.5                  # 最大线速度 m/s
w_max: 1.5                  # 最大角速度 rad/s（Scout v2 仿真限速 2.0；旧值 0.8 只有 40%）
a_decel_max: 1.0            # 最大减速度 m/s²：调小=更早开始减速
a_lat_max: 1.5              # 最大横向加速度 m/s²：高速拐角限速来源
robot_radius: 0.46          # 车体半径 m（膨胀基准，必须真实）

# ── 2. 感知范围（所有规划距离的无量纲基准）──
perception_range: 20.0      # 上游局部感知栅格的范围基准 m。换感知源/换车型只改这里，其余比例自动迁移

# ── 3. 栅格预处理 ──
inflation_radius: 0.7       # 膨胀半径 = robot_radius + 跟踪误差余量 m。
                            # 太大把窄通道堵死 → RECOVERY
footprint_clear_radius: 0.50  # 车体足迹清空半径 m（≥robot_radius 且 <inflation_radius）。
                              # 只抹膨胀出来的格，lidar 真打到的障碍仍保持 occupied
inflate_unknown: false      # true=保守（未知当障碍）；false=乐观探索（默认）

# ── 4. 滚动时域规划（子目标距离 / 扇形选向 / 路径采样）──
plan_freq: 10.0             # 规划频率 Hz（反应延迟 ≈ 1/freq + 控制周期）
lookahead_ratio: 0.6        # 前瞻距离 = 0.6 × 20 = 12m（路径最大长度上界）
subgoal_min_ratio: 0.10     # 子目标最小距离 = 0.10 × 20 = 2.0m（下限保护）
path_spacing: 0.05          # 路径等距重采样间距 m（≈ 栅格分辨率一半）
curvature_baseline: 0.30    # 曲率测量基线 m（必须 ≫ path_spacing，防阶梯假曲率）
goal_tolerance: 0.5         # 到达判定距离 m（只判距离不判航向）
goal_snap_dist: 1.0         # 子目标落障碍格时的螺旋吸附半径 m（应 ≥ inflation_radius）
goal_clear_radius: 0.0      # 终点清洞半径 m；0=关闭。
                            # 须 ≥ inflation_radius 才能真让贴墙终点可达
# 子目标扇形选取（中心方向被截断时展开候选打分选优）
subgoal_fan_half_deg: 90.0  # 扇形半角 deg；0=关闭扇形退回单射线
subgoal_fan_step_deg: 5.0   # 扇形角步长 deg
subgoal_align_w: 3.0        # 终点对齐权重 cos(θ−θ_goal)；必须 > subgoal_free_w
subgoal_free_w: 1.0         # 饱和自由距离权重
subgoal_prev_w: 1.0         # 上帧方向一致性权重；0=关闭
subgoal_clearance: 0.3      # 截断时子目标与膨胀带边缘净空 m；0=复现旧行为

# ── 5. 链式前瞻 + 曲线拟合（终点模式增强，与沿路模式共用代码）──
# "看多深"扇形选方向，"走多近"定每跳落点，跳点串成 Catmull-Rom 样条控制点。
# 终点模式额外加 goal_align_w × cos(射线−子目标方向) 偏向目标方向。
chain_hops: 2               # 跳点数 1..16；1=退化单跳（走直线不拟合）
road_step_dist: 100.0       # 走多近·固定米 m；给大值=不额外限制
road_step_ratio: 1.0        # 走多近·比例 (0,1]×看多深；1.0=走到末端（旧行为）
chain_ema_alpha: 0.3        # κ 跨帧 EMA (0,1]；大=快响应但抖
goal_align_w: 1.0           # 链式打分偏向子目标方向；0=不偏向；建议 1.0~2.0
curve_fit_enable: true      # false=完全恢复直线路径行为

# ── 6. 沿路模式（无定位，走廊即道路）──
# 本文件为终点模式配置，follow_road=false。
# 沿路模式使用独立副本 nav_params_road.yaml（road_follow.launch 加载它）。
follow_road: false          # true=沿路模式（不读 pose/goal）；false=终点导航
road_fan_half_deg: 75.0     # 车头前向半球扫描半角 deg
road_fan_step_deg: 3.0      # 扇形角步长 deg
road_lookahead_ratio: 0.35  # 沿路前瞻（看多深基准）= ratio×perception_range
lookahead_speed_k: 0.0      # 看多深·速度增益 s：L(v)=基准 + k×v，上限 perception_range；0=不随速度（零回归）
road_free_w: 2.0            # 自由距离权重（必须 > road_align_w）
road_align_w: 1.0           # 车头对齐权重

# ── 7. 速度规划（制动包络：v 必须能在视距内刹住）──
safety_margin: 0.3          # 附加安全距离 m：调大=更早减速
t_reaction: 0.1             # 反应时间 s（规划周期延迟补偿）
kappa_max: 0.0              # 最大曲率硬门限 1/m；0=关闭（差速可原地转）
dk_max: 50.0                # 最大曲率变化率 1/(m·s)：调小=拐弯更缓

# ── 8. 卡死 / 脱困（判推进量不判位移，振荡零进展也能抓住）──
stuck_time: 5.0             # 判定时长 s：这么久内推进 < stuck_dist → RECOVERY
stuck_dist: 0.1             # 推进阈值 m（须 < 正常绕行单窗口推进量）
recovery_max_retry: 3       # 重试上限，超过 → ABORT 停车交还决策权

# ── 9. 控制器（PurePursuitController）──
pursuit_lookahead: 0.8      # 纯跟踪前视点距离 m。小=贴线紧但抖，大=平滑但切内角
control_freq: 50.0          # 控制环频率 Hz（与 plan_freq 解耦）。<=0=不拆环
cmd_a_max: 3.0              # 线速度指令斜率限幅 m/s²
cmd_w_dot_max: 6.0          # 角速度指令斜率限幅 rad/s²

# ── 10. A* 搜索（astar.h/cpp 保留供独立模块与单测，NavCore 当前不调用）──
unknown_cost: 1.4           # 穿越 unknown 格代价倍率（>1 偏向已知自由区）
obstacle_cost_k: 1.0        # 障碍距离软代价强度；0=关
obstacle_cost_sigma: 0.35   # 衰减尺度 m（≈想额外保持的离墙净空）
