# ═══════════════════════════════════════════════════════════════════════════
# unk_nav 算法库配置（唯一事实源，与 ROS 无关）
#
# 谁在读这个文件：
#   · 仿真：nav_node 启动时经 unk::loadNavParams() 读取（路径由 launch 的
#     config_file 私有参数传入，不走 ROS 参数服务器）
#   · 离线 demo：./unk_nav_demo --config <本文件路径>
#   · 实车/MDC：集成方直接调 unk::loadNavParams()，同一份配置
#
# 格式约束（params_io.cpp 严格校验）：
#   · 顶层扁平 `key: value`，key 与 types.h::NavParams 字段一一对应
#   · 写了未知 key 或类型不对 → 启动直接报错退出（拼错 key 不会静默失效）
#   · 没写的 key → 保持代码默认值
#   · 加新参数三处同步：types.h 字段 + params_io.cpp 绑定表 + 本文件一行
#
# ── 症状 → 该动哪个参数（速查）────────────────────────────────────────────
# 撞障碍/贴边太近      → inflation_radius↑、pursuit_lookahead↓
# 窄通道过不去/老 ABORT → inflation_radius↓（膨胀带会把窄通道堵死）
# 绿线终点扎进膨胀带    → 看 /unk_nav/state 有无 subgoal_trunc（有=正常截断）；
#                        持续截断不前进 → inflation_radius↓ 或 goal_snap_dist↑
# 不绕障碍、直冲墙      → lookahead_ratio↑（看更远，但也更慢反应）
# 路径抖动/拐角切内角   → pursuit_lookahead↑、smooth_laplacian_iters↓
# 过弯太慢             → smooth_corner_speed↑、a_lat_max↑
# 刹车顿挫/急停频繁     → safety_margin↑（更早减速）、a_decel_max↓、t_reaction↑
# 到点不停/停太偏       → goal_tolerance↓
# 跟踪不紧/车身拖在弯外  → control_freq↑（控制环与规划环解耦）、w_max↑
# 指令跳变/执行器饱和   → cmd_a_max↓、cmd_w_dot_max↓（查底盘真实能力）
# 卡住不放弃/放弃太快   → stuck_time、recovery_max_retry
# 路径爱穿未知区        → unknown_cost↑（1=无所谓，越大越躲开 unknown）
# 贴墙不减速/冲过终点   → stop_horizon 自动生效，查 limit_by=subgoal_horizon
# 凹槽内振荡不绕        → subgoal_fan_half_deg↑、subgoal_align_w↓
# 终点贴墙到不了 ABORT  → goal_clear_radius ≥ inflation_radius
# ═══════════════════════════════════════════════════════════════════════════

# ── 车辆能力（Scout v2 差速底盘）──
v_max: 1.5                  # 最大线速度 m/s（Scout v2 实际可达 1.5）
w_max: 1.5                  # 最大角速度 rad/s（纯跟踪限幅 + 过弯限速 + 倒角半径共用）。
                            # Scout v2 仿真限速 2.0 rad/s（scout2_control.yaml）；旧值
                            # 0.8 只有能力的 40%，弯中角速度被削 → 横向稳态误差不收敛
a_decel_max: 1.0            # 最大减速度 m/s²：制动包络的斜率，调小=更早开始减速
a_lat_max: 1.5              # 最大横向加速度 m/s²：a_lat=v²/r，高速拐角的限速来源
robot_radius: 0.46          # 车体半径 m（长0.925/2 取半长轴）——膨胀的基准，必须真实

# ── 感知尺度（所有规划距离的无量纲基准）──
sensor_range: 20.0          # 激光有效量程 m。lookahead/subgoal_min 都乘这个值，
                            # 换雷达只改这里，其余比例自动迁移

# ── 栅格预处理 ──
# 膨胀半径 = robot_radius + 跟踪误差余量。余量是给控制器跟踪误差留的：
# 路径只保证中心线有 (inflation_radius - robot_radius) 的净空。
# 注意：膨胀带两侧总宽 2×inflation，太大会把窄通道整个堵死 → 频繁 RECOVERY。
inflation_radius: 0.7      # 【当前实验值，偏大】推荐 0.7~0.9；若 goal_snap_dist <
                            # 带半宽，子目标落进带里时 A* 吸附逃不出（现已由射线截断兜底）
footprint_clear_radius: 0.50  # 车体足迹清空半径 m（膨胀后把车脚下掏空，防起点死锁）。
                              # 只抹「膨胀出来的」格，lidar 真打到的障碍在本半径内
                              # 仍保持 occupied。必须 ≥ robot_radius 且 < inflation_radius
inflate_unknown: false      # unknown 是否也膨胀成障碍。true=保守（不确定的当障碍），
                            # false=乐观探索（默认，未知区可通行但代价略高）

# ── 滚动时域规划（子目标 = 车→终点直线上 min(前瞻, 终点距离, 窗口) 处，撞膨胀带则回退）──
lookahead_ratio: 0.6       # 前瞻距离 = 0.35 × 20 = 7.0m → 绿线最大长度就是它。
                            # 调大=看得远走得顺但反应慢；调小=贴地但抖
subgoal_min_ratio: 0.10     # 子目标最小距离 = 0.10 × 20 = 2.0m（前瞻的下限保护，
                            # 防止 sensor_range 缩小时子目标贴脸）
path_spacing: 0.05          # 路径等距重采样间距 m。影响曲率估计和速度规划的点密度；
                            # 建议 ≈ 栅格分辨率的一半
curvature_baseline: 0.30    # 曲率测量基线 m：用弧长相距 ±0.15m 两点估曲率。
                            # 必须 ≫ path_spacing，否则栅格阶梯抖动=假曲率→过弯被压成爬行
goal_tolerance: 0.5         # 到达判定距离 m（只判距离不判航向）。到点不停→调小；
                            # 终点附近墨迹→调大
goal_snap_dist: 1.0         # A* 子目标落在障碍格时的螺旋吸附半径 m。
                            # 应 ≥ inflation_radius 才有逃生能力（射线截断已兜底，此为双保险）
# 子目标扇形选取（终点模式专用，沿路模式不读）
# 中心方向被障碍截断时展开扇形候选，打分选优。
# subgoal_fan_half_deg=0 + subgoal_clearance=0 → 选取行为退回旧版单射线
subgoal_fan_half_deg: 90.0   # 扇形半角 deg；0=关闭扇形，退回单射线
subgoal_fan_step_deg: 5.0    # 扇形角步长 deg
subgoal_align_w: 3.0         # 终点对齐权重 cos(θ-θ_goal)；必须 > subgoal_free_w
subgoal_free_w: 1.0          # 饱和自由距离权重（饱和参考 = subgoalMin()）
subgoal_prev_w: 1.0          # 上帧方向一致性权重；0=关闭滞后（防翻烧饼）
subgoal_clearance: 0.3       # 截断时子目标与膨胀带边缘的净空 m；0=复现旧行为
                              # 约等于 obstacle_cost_sigma，让子目标自带净空
                              # 不与 A* 的障碍软代价在路径末段对打
goal_clear_radius: 0.0        # 终点清洞半径 m；0=关闭（终点贴墙场景才需要）
                              # 注意：清洞半径 < inflation_radius 时，终点周边会被膨胀带
                              # 围成孤岛，A* 反而无解；要真让“贴墙终点”可达，
                              # 须设 goal_clear_radius ≥ inflation_radius
plan_freq: 10.0             # 规划频率 Hz。反应延迟 ≈ 1/freq + 控制周期，高速时可调高

# ── A* 搜索 ──
astar_max_iter: 200000      # 单次搜索迭代上限（护栏，正常远打不满；340×340 全图≈11.5万）
unknown_cost: 1.4           # 穿越 unknown 格的代价倍率（>1 偏向已知自由区）。
                            # 路径爱从陌生区抄近路→调大；太保守不敢探索→调小到 1.0
astar_w: 1.0                # 启发式权重 f=g+w*h。1.0=严格最优（默认，靠 h 打破 f 相等对称）；
                            # >1（如 1.05）=加权 A*，扩展更少但代价次优 ≤w×。一般保持 1.0
# 障碍距离软代价（批次2）：单格代价 step×(1+k·exp(-d/σ))，d=该格到最近障碍距离。
# 路径流向通道中央、离墙更远、更平滑（ROS costmap cost_scaling 同款）。代价因子恒 ≥1
# → 不破坏 A* 最优性。启用后可把下方 inflation_radius 调薄（软梯度替代厚膨胀带）。
obstacle_cost_k: 1.0        # 强度。0=关（代码默认，零开销）；1.0=墙边代价≈2×、3σ外→1×
obstacle_cost_sigma: 0.35   # 衰减尺度 m（≈想额外保持的离墙净空）。截断半径=3σ，超出视为远
# 路径一致性软代价（批次3）：单格代价再加 k·(1-exp(-d_prev/σ))，d_prev=该格到上帧路径距离。
# 专治「轴对称镜像 f/g/h 全相等 → 每帧左右翻烧饼」的抖动（tie-break 对真相等无效）：
# 沿上帧走天然更便宜。只加不减 → 不破坏 A* 最优性。抖得厉害→k↑；该改道时反应慢/黏过头→k↓或σ↓。
consistency_k: 0.4          # 强度。0=关（代码默认，零开销）；0.3~0.5 起步，抖仍明显再往上
consistency_sigma: 0.4      # 黏性走廊半宽 m。截断半径=3σ；太大黏过头、真该改道时反应慢

# ── 速度规划（制动包络：v 必须能在 (s - 反应距离 - 安全距离) 内刹住）──
safety_margin: 0.3         # 制动包络附加安全距离 m：调大=更早减速，更保守
t_reaction: 0.1             # 反应时间 s：包络先扣 v×t_reaction 再算刹车距离（规划周期延迟补偿）
kappa_max: 0.0              # 最大曲率硬门限 1/m，0=关闭。差速底盘能原地转，默认关；
                            # 只有阿克曼底盘或禁止原地打方向的平台才设正值
dk_max: 50.0                # 最大曲率变化率 1/(m·s)：限制沿路径的打舵速度，调小=拐弯更缓

# ── 路径平滑（A* 栅格折线 → 可跟踪曲线）──
smooth_corner_speed: 0.22   # 目标过弯速度 m/s，倒角半径由它反解
                            # r = max(v/w_max, v²/a_lat_max)。调大=弯更平缓但半径大、
                            # 窄位可能贴障碍；0=关闭倒角
smooth_laplacian_iters: 2   # 拉普拉斯松弛迭代次数，0=关闭。调大=更平滑但可能收缩进障碍
smooth_laplacian_lambda: 0.2  # 松弛系数 (0,1)，每次迭代向邻点平均移动的比例
smooth_shrink_retry: 3      # 倒角圆弧撞碰撞时半径折半重试次数（防平滑后反而不可行）

# ── 卡死 / 脱困（判"推进量"不判"位移量"：振荡零进展也能抓住）──
stuck_time: 5.0             # 判定时长 s：这么久内朝终点推进 < stuck_dist → RECOVERY
stuck_dist: 0.1             # 推进阈值 m：必须 < 正常绕行的单窗口推进量，否则绕行被误判
recovery_max_retry: 3       # RECOVERY 重试上限，超过 → ABORT 停车交还决策权

# ── 控制器（PurePursuitController，controller.h）──
pursuit_lookahead: 0.8      # 纯跟踪前视点沿路径的距离 m。调小=贴线紧但抖、
                            # 切内角浅；调大=平滑但拐角切内角深（配合弦碰撞检测自动回退）
control_freq: 50.0          # 控制环频率 Hz（/cmd_vel）。与 plan_freq 解耦：规划仍 10Hz，
                            # 但指令按 50Hz 刷新，消除 10Hz 零阶保持的 15~30cm 跟踪滞后。
                            # 前提：控制层会推算车在规划时刻栅格系下的当前位姿（有 odom 用
                            # odom 位姿差，无 odom 积分自己发的指令）。<=0 = 不拆环
cmd_a_max: 3.0              # 线速度指令斜率限幅 m/s²（= 底盘上限，再小更柔）
cmd_w_dot_max: 6.0          # 角速度指令斜率限幅 rad/s²（0→0.8 曾需要 133ms，比一个旧
                            # 控制周期还长 → 每条指令都在饱和区）

# ── 沿路模式（无定位，路线 A：两侧路缘/墙夹出的走廊即道路）──
# 默认关闭 → 终点导航行为逐字节不变。启用见独立副本 config/nav_params_road.yaml
# （road_follow.launch 用它）。开启后 NavCore 不再读 vehicle_pose/goal，改从道路走廊
# 几何（road_follow.h 前向半球扇形扫描）直接推车体系前瞻子目标 → 无定位沿路行驶。
follow_road: false          # true=道路前瞻子目标（无定位）；false=原终点投影（默认）
road_fan_half_deg: 75.0     # 车头前向半球扫描半角 deg（θ=0 正前方）
road_fan_step_deg: 3.0      # 扇形角步长 deg
road_lookahead_ratio: 0.35  # 沿路前瞻 = ratio×sensor_range
road_free_w: 2.0            # 打分权重：前方自由距离（越空越想走 → 弯道偏向外侧长边）。必须 > road_align_w
road_align_w: 1.0           # 打分权重：车头对齐 cosθ（越想直行 → 抑制摆动）
